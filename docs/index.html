document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

font-weight:700;letter-spacing:-.01em;white-space:nowrap\">Research Tracker<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:stretch;gap:2px;flex:0 0 auto\">\n      <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"6\">\n        <button type=\"button\" sc-camel-on-click=\"{{ tab.go }}\" style=\"background:{{ tab.bg }};border:0;border-bottom:3px solid {{ tab.line }};color:{{ tab.fg }};padding:0 17px;font-family:Archivo,sans-serif;font-size:14px;font-weight:{{ tab.weight }};cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap\">\n          {{ tab.label }}\n          <sc-if value=\"{{ tab.badge }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"background:#E0303F;color:#ffffff;font-size:12px;font-weight:700;border-radius:9px;padding:1px 7px;line-height:1.5\">{{ tab.badge }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:12px\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;font-size:13px;color:#D5E8DC;white-space:nowrap;flex:0 0 auto\">\n      <span>Window 2025–2026<\u002Fspan>\n      <span style=\"width:1px;height:20px;background:rgba(255,255,255,.3)\"><\u002Fspan>\n      <span>Roster 2026-08-27<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ DASHBOARD ============ -->\n  <sc-if value=\"{{ onDash }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"padding:24px 26px 30px\">\n\n    <div data-rise=\"\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px\">\n      <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div style=\"background:#ffffff;border-radius:8px;padding:18px 20px;border-top:4px solid {{ t.color }}\">\n          <div style=\"font-size:38px;font-weight:800;letter-spacing:-.025em;line-height:1.02;font-variant-numeric:tabular-nums\">{{ t.v }}<\u002Fdiv>\n          <div style=\"font-size:14px;font-wei ,1)\"><\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"flex:1\">\n            <div style=\"font-size:16px;font-weight:600\">{{ schedTitle }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#63736A;margin-top:2px\">{{ schedSub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px\">\n          <div>\n            <div style=\"font-size:12.5px;font-weight:600;color:#3A4A41;margin-bottom:7px\">Day<\u002Fdiv>\n            <div style=\"display:flex;gap:4px\">\n              <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"7\">\n                <button type=\"button\" sc-camel-on-click=\"{{ d.pick }}\" style=\"flex:1;background:{{ d.bg }};color:{{ d.fg }};border:1px solid {{ d.border }};border-radius:5px;padding:9px 0;font-family:Archivo,sans-serif;font-size:12.5px;font-weight:{{ d.weight }};cursor:pointer\">{{ d.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:12.5px;font-weight:600;color:#3A4A41;margin-bottom:7px\">Time<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;border:1px solid #D5DED8;border-radius:5px;padding:8px 12px;background:#ffffff\">\n              <span style=\"font-size:15px;font-weight:600;font-variant-numeric:tabular-nums\">06:00<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#63736A\">after the Scopus nightly update<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px;border-top:1px solid #F0F3F1;padding-top:18px\">\n          <div style=\"font-size:12.5px;font-weight:600;color:#3A4A41;margin-bottom:11px\">Next four runs<\u002Fdiv>\n          <sc-for list=\"{{ nextRuns }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px \n            <div style=\"display:flex;align-items:center;gap:10px;font-size:13.5px;background:#F4F6F5;padding:11px 13px;border-radius:6px\">\n              <span style=\"font-weight:600;flex:1\">Computer and Information Sciences<\u002Fspan>\n              <span style=\"color:#63736A\">28 people<\u002Fspan>\n              <span style=\"color:#63736A\">→<\u002Fspan>\n              <span style=\"font-weight:600\">Engineering<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;font-size:13.5px;background:#F4F6F5;padding:11px 13px;border-radius:6px\">\n              <span style=\"font-weight:600;flex:1\">Health Sciences<\u002Fspan>\n              <span style=\"color:#63736A\">1 person<\u002Fspan>\n              <span style=\"color:#63736A\">→<\u002Fspan>\n              <span style=\"font-weight:600\">Nursing<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" style=\"margin-top:16px;background:#ffffff;color:{{ accent }};border:1px solid #C3D6CA;border-radius:6px;padding:9px 16px;font-family:Archivo,sans-serif;font-size:13.5px;font-weight:600;cursor:pointer\">Edit the map<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ WORKFLOW ============ -->\n  <sc-if value=\"{{ onFlow }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:26px 26px 34px;overflow-x:auto\">\n    <div data-rise=\"\" style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px\">\n      <div>\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:{{ accent }}\">What happens on a run<\u002Fdiv>\n        <div style=\"font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px\">Six stages, roster first, Scopus second<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#63736A;text-align:right;line-height:1.5\">The roster decides who belongs to the university.<br>Scopus supplies the papers, never the membership.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;width:1308px;height:450px\">\n      <svg width=\"1308\" height=\"450\" sc-camel-view-box=\"0 0 1308 450\" style=\"position:absolute;left:0;top:0;overflow:visible\">\n        <defs>\n          <marker id=\"fcArrow\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\">\n            <path d=\"M0,1 L9,5 L0,9 z\" fill=\"#8FA69A\"><\u002Fpath>\n          <\u002Fmarker>\n          <marker id=\"fcArrowRed\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\">\n            <path d=\"M0,1 L9,5 L0,9 z\" fill=\"#E0303F\"><\u002Fpath>\n          <\u002Fmarker>\n        <\u002Fdefs>\n        <g fill=\"none\" stroke=\"#D3DDD7\" stroke-width=\"2\" marker-end=\"url(#fcArrow)\">\n          <path d=\"M236,64 C252,64 252,140 268,140\"><\u002Fpath>\n          <path d=\"M236,216 C252,216 252,140 268,140\"><\u002Fpath>\n          <path d=\"M504,140 C518,140 522,64 536,64\"><\u002Fpath>\n          <path d=\"M504,140 C518,140 522,216 536,216\"><\u002Fpath>\n          <path d=\"M772,216 H823\"><\u002Fpath>\n          <path d=\"M772,64 H1150 C1172,64 1190,74 1190,92\"><\u002Fpath>\n          <path d=\"M1021,216 C1042,216 1050,154 1072,154\"><\u002Fpath>\n          <path d=\"M1190,216 V350\"><\u002Fpath>\n        <\u002Fg>\n        <g fill=\"none\" stroke=\"#E0303F\" stroke-width=\"2\" marker-end=\"url(#fcArrowRed)\">\n          <path d=\"M922,315 V350\"><\u002Fpath>\n        <\u002Fg>\n        <g fill=\"none\" stroke-width=\"2.5\" stroke-dasharray=\"8 16\" stroke-linecap=\"round\">\n          <path data-dash=\"\" d=\"M236,64 C252,64 252,140 268,140\" stroke=\"{{ accent }}\" style=\"animation-delay:0s\"><\u002Fpath>\n          <path data-dash=\"\" d=\"M236,216 C252,216 252,140 268,140\" stroke=\"#F27524\" style=\"animation-delay:.12s\"><\u002Fpath>\n          <path data-dash=\"\" d=\"M504,140 C518,140 522,64 536,64\" stroke=\"{{ accent }}\" style=\"animation-delay:.2s\"><\u002Fpath>\n          <path data-dash=\"\" d=\"M504,140 C518,140 522,216 536,216\" stroke=\"{{ accent }}\" style=\"animation-delay:.28s\"><\u002Fpath>\n          <path data-dash=\"\" d=\"M772,216 H823\" stroke=\"{{ accent }}\" style=\"animation-delay:.36s\"><\u002Fpath>\n          <path data-dash=\"\" d=\"M772,64 H1150 C1172,64 1190,74 1190,92\" stroke=\"{{ accent }}\" style=\"animation-delay:.44s\"><\u002Fpath>\n          <path data-dash=\"\" d=\"M1021,216 C1042,216 1050,154 1072,154\" stroke=\"{{ accent }}\" style=\"animation-delay:.52s\"><\u002Fpath>\n          <path data-dash=\"\" d=\"M922,315 V350\" stroke=\"#E0303F\" style=\"animation-delay:.6s\"><\u002Fpath>\n          <path data-dash=\"\" d=\"M1190,216 V350\" stroke=\"{{ accent }}\" style=\"animation-delay:.68s\"><\u002Fpath>\n        <\u002Fg>\n      <\u002Fsvg>\n\n      <div data-node=\"\" style=\"position:absolute;left:0;top:16px;width:236px;height:96px;background:#ffffff;border-radius:8px;border-left:4px solid {{ accent }};padding:14px 16px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <img src=\"23935111-cf14-43dc-850c-9c0769dbf7be\" alt=\"Al Ain University\" style=\"height:20px;width:auto;display:block\">\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#63736A\">Source<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:15.5px;font-weight:700;margin-top:8px\">Faculty roster<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:3px\">Who the university says belongs to it<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-node=\"\" style=\"animation-delay:.08s;position:absolute;left:0;top:168px;width:236px;height:96px;background:#ffffff;border-radius:8px;border-left:4px solid #F27524;padding:14px 16px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <img src=\"cd9c78f2-1adb-4a43-a435-7feb783b05fe\" alt=\"Scopus\" style=\"height:20px;width:auto;display:block;border-radius:3px\">\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#63736A\">Source<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:15.5px;font-weight:700;margin-top:8px\">Scopus<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:3px\">Papers, author records and citations<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-node=\"\" style=\"animation-delay:.16s;position:absolute;left:268px;top:92px;width:236px;height:96px;background:#ffffff;border-radius:8px;border-top:4px solid {{ accent }};padding:13px 16px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\">\n          <span style=\"font-size:11.5px;font-weight:800;color:{{ accent }}\">01<\u002Fspan>\n          <span style=\"font-size:15.5px;font-weight:700\">Match names to authors<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:5px;line-height:1.4\">Tiered, ending with near-miss spellings<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:8px;line-height:1.4\">A name matching several authors is never guessed at.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-node=\"\" style=\"animation-delay:.24s;position:absolute;left:536px;top:16px;width:236px;height:96px;background:#ffffff;border-radius:8px;border-top:4px solid {{ accent }};padding:13px 16px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\">\n          <span style=\"font-size:11.5px;font-weight:800;color:{{ accent }}\">02<\u002Fspan>\n          <span style=\"font-size:15.5px;font-weight:700\">Papers under AAU<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:5px;line-height:1.4\">The window Scopus files under the university<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:8px;line-height:1.4\">The defensible core of the count.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-node=\"\" style=\"animation-delay:.32s;position:absolute;left:536px;top:168px;width:236px;height:96px;background:#ffffff;border-radius:8px;border-top:4px solid {{ accent }};padding:13px 16px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\">\n          <span style=\"font-size:11.5px;font-weight:800;color:{{ accent }}\">03<\u002Fspan>\n          <span style=\"font-size:15.5px;font-weight:700\">Sweep each author<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:5px;line-height:1.4\">Catches papers the university tag missed<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:8px;line-height:1.4\">Every candidate still has to pass the gate.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-node=\"\" style=\"animation-delay:.4s;position:absolute;left:852px;top:146px;width:140px;height:140px;background:#ffffff;border:2px solid #E0303F;border-radius:10px;transform:rotate(45deg);box-sizing:border-box\"><\u002Fdiv>\n      <div style=\"position:absolute;left:852px;top:146px;width:140px;height:140px;display:flex;align-items:center;justify-content:center;pointer-events:none\">\n        <div style=\"width:98px;text-align:center\">\n          <div style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#E0303F\">Gate<\u002Fdiv>\n          <div style=\"font-size:12.5px;font-weight:700;line-height:1.3;margin-top:4px\">Does the paper print an AAU address?<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:absolute;left:1024px;top:170px;background:#F4F6F5;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:700;color:{{ accent }}\">yes<\u002Fdiv>\n      <div style=\"position:absolute;left:930px;top:318px;background:#F4F6F5;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:700;color:#E0303F\">no<\u002Fdiv>\n\n      <div data-node=\"\" style=\"animation-delay:.48s;position:absolute;left:1072px;top:92px;width:236px;height:124px;background:#ffffff;border-radius:8px;border-top:4px solid {{ accent }};padding:14px 16px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:baseline;gap:8px\">\n          <span style=\"font-size:11.5px;font-weight:800;color:{{ accent }}\">04<\u002Fspan>\n          <span style=\"font-size:15.5px;font-weight:700\">The census<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:5px;line-height:1.4\">Sorted into faculty and students, placed in colleges, compared with last run<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:8px;line-height:1.4\">Written, then compared against the previous run.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-node=\"\" style=\"animation-delay:.56s;position:absolute;left:797px;top:350px;width:250px;height:84px;background:#FCF4F5;border-radius:8px;border:1px dashed #E7A9B0;padding:13px 16px;box-sizing:border-box\">\n        <div style=\"font-size:13.5px;font-weight:700;color:#8B2A32\">Rejected<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8B2A32;line-height:1.4;margin-top:5px\">Not one author on them printed an Al Ain University address<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-node=\"\" style=\"animation-delay:.64s;position:absolute;left:1072px;top:350px;width:236px;height:84px;background:#ffffff;border-radius:8px;border-top:4px solid {{ accent }};padding:13px 16px;box-sizing:border-box\">\n        <div style=\"font-size:15.5px;font-weight:700\">Files to download<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#63736A;margin-top:5px;line-height:1.4\">Workbook, slide deck and chart pack, each stamped with the run id<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-fade=\"\" style=\"animation-delay:.8s;display:flex;align-items:center;gap:14px;margin-top:6px;padding:12px 16px;background:#ffffff;border-radius:8px;width:1308px;box-sizing:border-box\">\n      <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#63736A;flex:0 0 auto\">Data sources<\u002Fspan>\n      <img src=\"5604040b-36ec-4643-89b6-5282e357f3a8\" alt=\"Elsevier Scopus\" style=\"height:34px;width:auto;display:block\">\n      <span style=\"font-size:13px;color:#63736A;flex:1;line-height:1.45\">Papers, author records and citation counts come from Scopus. Membership of the university comes from the AAU faculty roster, never from Scopus.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px\">\n      <div data-rise=\"\" style=\"animation-delay:.1s;background:#ffffff;border-radius:8px;padding:18px 20px;border-left:4px solid {{ accent }}\">\n        <div style=\"font-size:14.5px;font-weight:700\">Why the gate exists<\u002Fdiv>\n        <div style=\"font-size:13px;color:#63736A;line-height:1.5;margin-top:7px\">A sweep by author returns everything that person published anywhere, including work they did at other universities. Without the gate the census re-inflates with papers that were never AAU's.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rise=\"\" style=\"animation-delay:.14s;background:#ffffff;border-radius:8px;padding:18px 20px;border-left:4px solid {{ accent }}\">\n        <div style=\"font-size:14.5px;font-weight:700\">Why a name can be missed<\u002Fdiv>\n        <div style=\"font-size:13px;color:#63736A;line-height:1.5;margin-top:7px\">The roster writes Al-Takhayneh, Scopus prints Al-Tkhayneh. One vowel apart. Exact matching misses it and a whole career disappears, so near-misses are checked separately before anyone is called new.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rise=\"\" style=\"animation-delay:.18s;background:#ffffff;border-radius:8px;padding:18px 20px;border-left:4px solid {{ accent }}\">\n        <div style=\"font-size:14.5px;font-weight:700\">What a healthy run looks like<\u002Fdiv>\n        <div style=\"font-size:13px;color:#63736A;line-height:1.5;margin-top:7px\">Run it twice on unchanged data and the second run reports nothing new. If it invents an addition, the papers are being matched wrongly, and that is a bug rather than a discovery.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  \n\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script>\n/* AAU Research Tracker -- live bridge.\n *\n * The interface was designed against fixed constants. This makes those\n * constants come from the local engine without touching a single style: the\n * arrays are mutated IN PLACE (the binding is const, the contents are not),\n * then the component is told to re-render. If no engine answers, the baked-in\n * figures stay and a badge says so, because a page that silently shows stale\n * numbers for named colleagues is worse than one that admits it is a sample.\n */\n(function () {\n  'use strict';\n\n  var G = '#0A7A3A', RED = '#E0303F', INK = '#1A1A1A', META = '#63736A';\n  var FONT = 'Archivo,sans-serif';\n  window.__AAU = { live: false, state: null, run: null };\n  var lastBadge = 'live data';\n\n  /* ------------------------------------------------------------- transport */\n  function api(path, body) {\n    var opt = { headers: { 'Content-Type': 'application/json' } };\n    if (body !== undefined) { opt.method = 'POST'; opt.body = JSON.stringify(body); }\n    return fetch(path, opt).then(function (r) {\n      if (!r.ok) throw new Error(path + ' -> HTTP ' + r.status);\n      return r.json();\n    });\n  }\n  window.__AAU.api = api;\n\n  /* ------------------------------------------------------------ the badge  */\n  function badge(text, color) {\n    var b = document.getElementById('__aau_badge');\n    if (!b) {\n      b = document.createElement('div');\n      b.id = '__aau_badge';\n      b.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9000;' +\n        'font:600 11.5px/1 ' + FONT + ';letter-spacing:.06em;text-transform:uppercase;' +\n        'padding:8px 13px;border-radius:6px;color:#fff;box-shadow:0 4px 14px -6px rgba(0,0,0,.4)';\n      document.body.appendChild(b);\n    }\n    b.textContent = text;\n    b.style.background = color;\n  }\n  window.__AAU.badge = badge;\n\n  /* ------------------------------------------------------------- the modal */\n  /* Built as plain DOM rather than added to the template, so the approved\n   * markup stays exactly as it was authored. Styles mirror the design tokens. */\n  function modal(spec) {\n    var old = document.getElementById('__aau_modal');\n    if (old) old.remove();\n\n    var wrap = document.createElement('div');\n    wrap.id = '__aau_modal';\n    wrap.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(12,30,20,.55);' +\n      'display:flex;align-items:center;justify-content:center;padding:24px;' +\n      'font-family:' + FONT + ';animation:uiFade .18s both';\n\n    var card = document.createElement('div');\n    card.style.cssText = 'background:#fff;border-radius:8px;width:' + (spec.width || 560) + 'px;' +\n      'max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);' +\n      'animation:uiRise .28s cubic-bezier(.22,.7,.2,1) both';\n\n    var head = document.createElement('div');\n    head.style.cssText = 'background:' + G + ';color:#fff;padding:22px 26px 20px';\n    head.innerHTML =\n      '<div style=\"font-size:11.5px;font-weight:700;letter-spacing:.09em;' +\n      'text-transform:uppercase;opacity:.75\">' + esc(spec.eyebrow || 'Run') + '<\u002Fdiv>' +\n      '<div style=\"font-size:21px;font-weight:700;letter-spacing:-.01em;margin-top:7px\">' +\n      esc(spec.title) + '<\u002Fdiv>' +\n      (spec.sub ? '<div style=\"font-size:14px;line-height:1.5;margin-top:8px;color:#D5E8DC\">' +\n        esc(spec.sub) + '<\u002Fdiv>' : '');\n    card.appendChild(head);\n\n    var body = document.createElement('div');\n    body.style.cssText = 'padding:20px 26px 24px';\n    card.appendChild(body);\n\n    (spec.choices || []).forEach(function (c, i) {\n      var b = document.createElement('button');\n      b.type = 'button';\n      b.style.cssText = 'display:block;width:100%;text-align:left;background:#fff;' +\n        'border:1px solid #E4EAE6;border-radius:8px;padding:15px 17px;margin-bottom:10px;' +\n        'cursor:pointer;font-family:' + FONT + ';transition:border-color .14s,background .14s;' +\n        'animation:uiRise .3s both;animation-delay:' + (0.04 * i).toFixed(2) + 's';\n      b.innerHTML =\n        '<div style=\"font-size:15px;font-weight:700;color:' + INK + '\">' + esc(c.label) + '<\u002Fdiv>' +\n        (c.hint ? '<div style=\"font-size:13px;color:' + META + ';margin-top:4px;line-height:1.45\">' +\n          esc(c.hint) + '<\u002Fdiv>' : '');\n      b.onmouseenter = function () { b.style.borderColor = G; b.style.background = '#F4F9F6'; };\n      b.onmouseleave = function () { b.style.borderColor = '#E4EAE6'; b.style.background = '#fff'; };\n      b.onclick = function () { close(); c.go && c.go(); };\n      body.appendChild(b);\n    });\n\n    if (spec.input) {\n      var inp = document.createElement('input');\n      inp.type = 'text';\n      inp.placeholder = spec.input.placeholder || '';\n      inp.value = spec.input.value || '';\n      inp.style.cssText = 'width:100%;box-sizing:border-box;border:1px solid #D5DED8;' +\n        'border-radius:6px;padding:13px 14px;font-family:' + FONT + ';font-size:14.5px;' +\n        'color:' + INK + ';outline:none';\n      inp.onfocus = function () { inp.style.borderColor = G; };\n      inp.onblur = function () { inp.style.borderColor = '#D5DED8'; };\n      body.appendChild(inp);\n      var note = document.createElement('div');\n      note.style.cssText = 'font-size:12.5px;color:' + META + ';margin-top:9px;line-height:1.5;min-height:18px';\n      note.textContent = spec.input.note || '';\n      body.appendChild(note);\n      spec.__input = inp; spec.__note = note;\n      setTimeout(function () { inp.focus(); }, 60);\n      inp.onkeydown = function (e) { if (e.key === 'Enter' && spec.submit) spec.submit.go(); };\n    }\n\n    if (spec.html) {\n      var d = document.createElement('div');\n      d.innerHTML = spec.html;\n      body.appendChild(d);\n    }\n\n    var row = document.createElement('div');\n    row.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;margin-top:18px';\n    var cancel = document.createElement('button');\n    cancel.type = 'button';\n    cancel.textContent = spec.cancelLabel || 'Cancel';\n    cancel.style.cssText = 'background:#fff;border:1px solid #D5DED8;border-radius:6px;' +\n      'padding:11px 18px;font-family:' + FONT + ';font-size:14px;font-weight:600;' +\n      'color:' + INK + ';cursor:pointer';\n    cancel.onclick = close;\n    row.appendChild(cancel);\n    if (spec.submit) {\n      var ok = document.createElement('button');\n      ok.type = 'button';\n      ok.textContent = spec.submit.label;\n      ok.style.cssText = 'background:' + G + ';border:0;border-radius:6px;padding:11px 20px;' +\n        'font-family:' + FONT + ';font-size:14px;font-weight:700;color:#fff;cursor:pointer';\n      ok.onclick = function () { spec.submit.go(); };\n      row.appendChild(ok);\n      spec.__ok = ok;\n    }\n    body.appendChild(row);\n\n    wrap.appendChild(card);\n    wrap.onclick = function (e) { if (e.target === wrap) close(); };\n    document.body.appendChild(wrap);\n    document.addEventListener('keydown', onEsc);\n    function onEsc(e) { if (e.key === 'Escape') close(); }\n    function close() {\n      document.removeEventListener('keydown', onEsc);\n      var m = document.getElementById('__aau_modal');\n      if (m) m.re hed: () => this.setState(s => ({ sched: !s.sched })),\n\n      // --- live wiring -----------------------------------------------------\n      q: this.state.q || '',\n      tag: this.state.tag || 'all',\n      searchHint: 'Search ' + AUTHORS.length.toLocaleString() + ' people…',\n      onSearch: (e) => this.setState({ q: e && e.target ? e.target.value : '' }),\n      exportAll: () => window.__AAU && window.__AAU.exportAll(this),\n      importCsv: () => window.__AAU && window.__AAU.importCsv(this),\n      hasSuggestions: !!(window.__AAU && window.__AAU.suggestions\n                         && window.__AAU.suggestions.length),\n      suggestTitle: (window.__AAU && window.__AAU.suggestions\n        ? (window.__AAU.suggestions.length === 1\n            ? 'We found someone who is not on your roster'\n            : 'We found ' + window.__AAU.suggestions.length\n              + ' people who are not on your roster')\n        : ''),\n      suggestSub: 'Their papers print an Al Ain University address and they '\n        + 'publish like faculty, but the roster does not list them. '\n        + 'Until you add them they count as outside faculty.',\n      openSuggestions: () => window.__AAU && window.__AAU.showSuggestions(this),\n      rosterHead: (S_ ? S_.roster_people.toLocaleString() + ' people across '\n        + COLLEGE_DATA.length + ' colleges' : '208 people across eight colleges'),\n      rosterSub: (S_ ? S_.resolved + ' of the ' + S_.academics\n        + ' on the roster resolved to a Scopus author. Open a college to see '\n        + 'its authors.'\n        : 'Open a college to see its authors.'),\n      exports: exports.map(e => Object.assign({}, e, { go: () => window.__AAU && window.__AAU.exportOne(this, e.kind) })),\n      candidates: candidates.map(c => Object.assign({}, c, { go: () => window.__AAU && window.__AAU.decide(this, c) })),\n      schedTrackBg: sched ? accent : '#C3CCC6',\n      schedKnobLeft: sched ? '25px' : '3px',\n      schedTitle: sched ? 'On, every Tues
