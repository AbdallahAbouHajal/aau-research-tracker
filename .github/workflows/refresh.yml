name: Refresh the census

# The engine runs HERE, on GitHub's machines. GitHub Pages serves files rather
# than processes, so the engine cannot listen for requests on the published
# site -- instead it runs on a schedule, when you press Run workflow, and when
# you press Run now on the page itself. It fetches Scopus for real and commits
# its answer as docs/data/state.json plus the three downloadable files.
#
# The six stages the interface draws are the six real steps below. That is what
# lets the published page show genuine progress: it asks GitHub which step is
# running and lights the matching stage. Nothing on that screen is simulated.

on:
  schedule:
    - cron: "0 3 * * 1"        # every Monday 03:00 UTC (07:00 Gulf time)
  workflow_dispatch:
    inputs:
      years:
        description: "Publication years, comma separated (blank = this year and last)"
        required: false
        default: ""
      scope:
        description: "What to report"
        required: false
        default: compare
        type: choice
        options: [compare, current]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  AAU_DATA: ${{ github.workspace }}/engine/data
  AAU_CACHE: ${{ github.workspace }}/engine/.cache
  AAU_STAGE_FILE: ${{ github.workspace }}/engine/.stage.json
  SCOPUS_KEYS_FILE: ${{ github.workspace }}/engine/config/scopus_keys.json
  # Through env, never interpolated into a command line: a workflow_dispatch
  # input is user-supplied text, and pasting it into a shell is how workflow
  # injection happens.
  YEARS: ${{ github.event.inputs.years }}
  SCOPE: ${{ github.event.inputs.scope }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keys never live in the repo. Set SCOPUS_KEYS in
      # Settings > Secrets and variables > Actions as a JSON array of strings.
      - name: Prepare
        env:
          SCOPUS_KEYS: ${{ secrets.SCOPUS_KEYS }}
        run: |
          if [ -z "$SCOPUS_KEYS" ]; then
            echo "::error::SCOPUS_KEYS secret is not set."
            exit 1
          fi
          mkdir -p config
          printf '%s' "$SCOPUS_KEYS" > config/scopus_keys.json
          python -c "
          import json
          k = json.load(open('config/scopus_keys.json'))
          assert isinstance(k, list) and k, 'SCOPUS_KEYS must be a JSON array'
          print('%d Scopus keys loaded' % len(k))"

      # Keeps the Scopus/OpenAlex cache between runs, so a weekly refresh only
      # pays for what is genuinely new.
      - name: Restore the fetch cache
        uses: actions/cache@v4
        with:
          path: engine/.cache
          key: aau-cache-${{ github.run_id }}
          restore-keys: aau-cache-

      # --- the six stages, named exactly as the interface draws them --------
      - name: Read the faculty roster
        run: python run_stage.py 1 --years "$YEARS" --scope "${SCOPE:-compare}"

      - name: Find each person in Scopus
        run: python run_stage.py 2

      - name: Collect the papers
        run: python run_stage.py 3

      - name: Check the extra papers found
        run: python run_stage.py 4

      - name: Sort faculty from students
        run: python run_stage.py 5

      - name: Build the census and compare
        run: python run_stage.py 6 --out "$GITHUB_WORKSPACE/docs/data/state.json"

      - name: Commit the new state
        working-directory: .
        run: |
          rm -f engine/config/scopus_keys.json engine/.stage.json
          test -s docs/data/state.json || { echo "::error::state.json is empty"; exit 1; }
          python -c "import json;json.load(open('docs/data/state.json'));print('state.json parses')"
          ls -la docs/downloads/ || true

          git config user.name  "aau-tracker[bot]"
          git config user.email "aau-tracker@users.noreply.github.com"

          # These files are GENERATED, not authored, so there is nothing to
          # merge: this run's output is simply the newest truth. The previous
          # attempt rebased instead, hit the guaranteed conflict on
          # state.json (both sides rewrite it), left conflict markers, and
          # reported success -- so a complete run was silently discarded.
          # Park the output, reset onto whatever is on main, put it back.
          OUT=$(mktemp -d)
          cp -R docs/data docs/downloads "$OUT"/

          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf docs/data docs/downloads
            cp -R "$OUT"/data "$OUT"/downloads docs/
            git add docs/data docs/downloads
            if git diff --cached --quiet; then
              echo "nothing changed"; exit 0
            fi
            git commit -m "Census refresh $(date -u +%Y-%m-%d) [skip ci]"
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "someone pushed first; attempt $i of 3"
            sleep 5
          done
          echo "::error::could not push the refresh after 3 attempts"
          exit 1

      # Reporting must never fail a run that worked.
      - name: Summary
        if: always()
        continue-on-error: true
        working-directory: .
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "docs/data/state.json"
          if not os.path.exists(p):
              print("## Refresh failed\n\nNo state.json was written."); raise SystemExit
          try:
              d = json.load(open(p))
          except Exception as exc:
              print("## Refresh finished, summary unavailable\n\n`%s`" % exc)
              raise SystemExit
          s = d.get("stats", {})
          print("## Census refreshed\n")
          print("| | |\n|---|---|")
          for k, v in (("Generated", d.get("generated")),
                       ("Papers", s.get("papers")),
                       ("Authors", s.get("authors")),
                       ("On the roster", s.get("faculty")),
                       ("Rejected by the affiliation gate", s.get("rejected")),
                       ("Added by the author sweep", s.get("swept_in")),
                       ("Not on the roster but publishing", s.get("suggested"))):
              print("| %s | %s |" % (k, v))
          PY
